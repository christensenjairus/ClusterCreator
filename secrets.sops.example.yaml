# ============================================================================
# PREVIEW ONLY — this .example file is NOT encrypted and NOT read by anything.
# It shows the intended structure of the real `secrets.sops.yaml`, which Stage 2
# will create and encrypt with `sops` (safe to commit once encrypted).
#
# Layout:
#   shared/        -> values identical across every PVE environment
#   environments/  -> per-datacenter values; `ccr ctx <cluster>` selects one
#                     (this replaces the manual comment-toggling in secrets.tf
#                      and PROXMOX_HOST in k8s.env)
# Replace every REPLACE_ME with the real value when you populate the encrypted file.
# ============================================================================

shared:
  vm_username: "k8s"
  minio_access_key: "REPLACE_ME"
  minio_secret_key: "REPLACE_ME"
  vm_ssh_keys:
    - "ssh-ed25519 AAAA... you@host"   # one entry per authorized key

environments:
  us-west-1:
    proxmox_host: "192.168.7.11"
    proxmox_api_token: "terraform@pve!provider=REPLACE_ME"
    unifi_password: "REPLACE_ME"
    vm_password: "REPLACE_ME"

  us-central-1:
    proxmox_host: "192.168.6.11"
    proxmox_api_token: "terraform@pve!provider=REPLACE_ME"
    unifi_password: "REPLACE_ME"
    vm_password: "REPLACE_ME"

  citadel:
    proxmox_host: "REPLACE_ME"
    proxmox_api_token: "terraform@pve!provider=REPLACE_ME"
    unifi_password: "REPLACE_ME"
    vm_password: "REPLACE_ME"
